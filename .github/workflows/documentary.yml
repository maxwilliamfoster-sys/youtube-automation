name: BuriedCasefiles — Generate & Deliver

# Fully cloud video GENERATION. TikTok posting is done by you, by hand, from your
# phone — the most shadowban-proof method, and your PC never needs to be on. Each run
# builds one video and sends it to Telegram with a ready-to-paste caption.
# (Auto-posting via Upload-Post is wired but dormant: TikTok needs their paid plan,
# so it stays off. It flips on with a paid upgrade — see tiktok_uploadpost.py.)

on:
  schedule:
    # Times are UTC; UK is BST (UTC+1). Each run makes ONE video and delivers it to
    # Telegram ~10-15 min after the cron fires (GitHub's scheduler isn't minute-exact).
    - cron: '45 7 * * *'     # ~09:00 UK — video 1
    - cron: '45 11 * * *'    # ~13:00 UK — video 2
    - cron: '45 14 * * *'    # ~16:00 UK — video 3
  workflow_dispatch:          # "Run workflow" button — generate on demand
    inputs:
      count:
        description: 'How many videos to generate'
        default: '1'
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write   # to commit recent_cases.json back so cases never repeat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Caches (first run is slow; later runs reuse models/assets) ─────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Cache models, font & music
        uses: actions/cache@v4
        with:
          path: |
            kokoro_models/
            assets/
            music/
            ~/.cache/huggingface
          key: assets-v3

      # ── System deps: only FFmpeg + audio libs. No browser, no Xvfb. ───────────
      #
      # timeout + retry because this step wedged on 2026-08-19: apt hung for 50
      # minutes (08:16 -> 09:06), hit the job's timeout-minutes ceiling, and every
      # step after it was skipped — the whole posting slot lost to a stuck package
      # mirror. The same step took 23 seconds an hour later, so it is an
      # intermittent mirror problem, not a broken package list.
      #
      # Without a step-level timeout a hang costs the entire 50-minute job budget
      # and delivers nothing. Five minutes is ~13x the normal runtime, so it only
      # trips on a genuine hang, and one retry picks a fresh mirror. If both
      # attempts fail the run dies in ~10 minutes with a clear cause instead of
      # silently burning the slot.
      - name: Install system packages
        timeout-minutes: 12
        run: |
          set -euo pipefail
          install_deps() {
            # `set -e` inside the function too: it runs via `bash -c`, which does not
            # inherit the outer shell's -e, so without this a failed update would fall
            # through to the install and report the install's status instead.
            set -e
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              ffmpeg espeak-ng libsndfile1 libgomp1
          }
          for attempt in 1 2; do
            if timeout 5m bash -c "$(declare -f install_deps); install_deps"; then
              echo "System packages installed (attempt ${attempt})."
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} timed out or failed after 5m."
            sudo pkill -9 -f apt-get || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock* || true
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::apt failed twice — package mirror is not responding."
          exit 1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── Chatterbox narrator ───────────────────────────────────────────────
      # The expressive British voice. CPU-only torch: no GPU on free runners, and
      # the CPU wheel is a fraction of the CUDA one. Measured at ~4.3x realtime,
      # so ~60s of narration costs ~5 min. If this step fails the pipeline still
      # runs — chatterbox_narrator.is_available() returns False and it falls back
      # to Kokoro, so a broken install degrades the voice instead of the video.
      - name: Install Chatterbox (expressive narrator)
        continue-on-error: true
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts

      - name: Download font + music assets
        run: python setup_music.py

      # ── Secrets → .env (generation keys + Telegram delivery) ──────────────────
      - name: Write .env
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER:    ${{ secrets.UPLOADPOST_USER }}
          TIKTOK_AUTOPOST:    ${{ secrets.TIKTOK_AUTOPOST }}
        run: |
          {
            echo "GROQ_API_KEY=$GROQ_API_KEY"
            echo "PEXELS_API_KEY=$PEXELS_API_KEY"
            echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY"
            echo "CEREBRAS_API_KEY=$CEREBRAS_API_KEY"
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
            echo "UPLOADPOST_API_KEY=$UPLOADPOST_API_KEY"
            echo "UPLOADPOST_USER=$UPLOADPOST_USER"
            echo "TIKTOK_AUTOPOST=$TIKTOK_AUTOPOST"
          } > .env

      # ── Generate videos and deliver them to Telegram ──────────────────────────
      - name: Generate & deliver
        run: python main_documentary.py --cloud --count ${{ github.event.inputs.count || '1' }}
        env:
          PYTHONUNBUFFERED: "1"

      # ── Persist used cases so future runs never repeat a case ─────────────────
      # case_pool.json rides along: rebuilding it costs ~60 rate-limited Wikipedia
      # calls, so it is committed and only refetched when it expires.
      #
      # documentary_log.json rides along too, and matters more than it looks. It is the
      # only record of what each run actually built. On an ephemeral runner an
      # uncommitted log dies with the container, so the pipeline was producing videos
      # and discarding every trace of what it had chosen — which is why there is no way
      # to ask "did the 90s cases do better than the 60s ones?" for anything made since
      # June. Committing it starts that record now.
      - name: Persist recent cases
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recent_cases.json case_pool.json documentary_log.json || true
          if git diff --staged --quiet; then
            echo "No new case to persist."
          else
            git commit -m "chore: update recent cases + generation log [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # ── Backup copy: downloadable from the run page for 2 days ─────────────────
      # Telegram is the real delivery path; this is only a fallback. It is allowed to
      # fail: the free artifact storage quota fills up, and when it did every run went
      # red even though the video had already been delivered successfully.
      # Retention is short so the quota cannot fill again.
      - name: Upload videos as artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 2
