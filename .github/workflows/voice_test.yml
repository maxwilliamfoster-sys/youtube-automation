name: Voice test — Chatterbox feasibility

# Throwaway experiment: can Chatterbox TTS run on a free GitHub runner, and how
# long does ~60s of narration take on CPU? Chatterbox beats ElevenLabs in blind
# preference tests, but the docs say production use wants a GPU — this measures
# whether the free CPU runner is viable for this pipeline. Delete once decided.

on:
  workflow_dispatch:

jobs:
  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Runner specs
        run: |
          echo "CPU cores: $(nproc)"
          free -g | head -2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chatterbox (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts

      - name: Generate narration sample (timed)
        run: |
          python - <<'PY'
          import time, torch, torchaudio
          from chatterbox.tts import ChatterboxTTS

          TEXT = ("In nineteen seventy-five, a fishing boat found a body floating off the "
                  "Isle of Mull, still wearing a pilot's uniform. The plane he had been "
                  "flying was never found. But that wasn't the strangest part. The autopsy "
                  "showed he had died before he ever hit the water. "
                  "So what really happened to Peter Gibbs?")

          t0 = time.time()
          model = ChatterboxTTS.from_pretrained(device="cpu")
          load_s = time.time() - t0
          print(f"MODEL LOAD: {load_s:.1f}s")

          # exaggeration drives emotional intensity; cfg_weight paces delivery.
          for tag, exag, cfg in [("neutral", 0.5, 0.5), ("emotive", 0.8, 0.3)]:
              t1 = time.time()
              wav = model.generate(TEXT, exaggeration=exag, cfg_weight=cfg)
              gen_s = time.time() - t1
              path = f"chatterbox_{tag}.wav"
              torchaudio.save(path, wav, model.sr)
              audio_s = wav.shape[-1] / model.sr
              print(f"{tag}: gen {gen_s:.1f}s for {audio_s:.1f}s audio "
                    f"(realtime factor {gen_s/audio_s:.2f}x)")
          PY

      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatterbox-samples
          path: chatterbox_*.wav
          if-no-files-found: warn
          retention-days: 3
