name: Voice test — Chatterbox British narrator

# Validates the narrator BEFORE wiring it into the pipeline: British male voice via
# reference cloning, slower pacing, and sentence-chunked generation so long scripts
# are not truncated. Outputs mp3 so the samples are actually playable.

on:
  workflow_dispatch:

jobs:
  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: chatterbox-pip-v1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Generate British narrator samples
        run: |
          python - <<'PY'
          import re, time, torch, torchaudio, subprocess
          from chatterbox.tts import ChatterboxTTS

          SCRIPT = ("In nineteen seventy-five, a fishing boat found a body floating off the "
                    "Isle of Mull, still wearing a pilot's uniform. The plane he had been "
                    "flying was never found. But that wasn't the strangest part. The autopsy "
                    "showed he had died before he ever hit the water. "
                    "So what really happened to Peter Gibbs?")

          def sentences(text):
              # Chatterbox truncates long input, so feed it one sentence at a time and
              # stitch the results. Also gives natural breathing room between beats.
              return [s.strip() for s in re.split(r'(?<=[.!?])\s+', text) if s.strip()]

          model = ChatterboxTTS.from_pretrained(device="cpu")
          print("model loaded")

          # cfg_weight controls pacing: lower = slower, more deliberate delivery.
          # The default 0.5 was judged too fast, so 0.3 is the candidate.
          VARIANTS = [
              ("ryan_slow",    "assets/narrator_ref_ryan.wav",   0.6, 0.3),
              ("ryan_slowest", "assets/narrator_ref_ryan.wav",   0.6, 0.2),
              ("thomas_slow",  "assets/narrator_ref_thomas.wav", 0.6, 0.3),
          ]
          for tag, ref, exag, cfg in VARIANTS:
              t0 = time.time()
              chunks = []
              for i, s in enumerate(sentences(SCRIPT)):
                  wav = model.generate(s, audio_prompt_path=ref,
                                       exaggeration=exag, cfg_weight=cfg)
                  chunks.append(wav)
                  # brief pause between sentences — documentary pacing
                  chunks.append(torch.zeros(1, int(model.sr * 0.28)))
              full = torch.cat(chunks, dim=-1)
              raw = f"{tag}.wav"
              torchaudio.save(raw, full, model.sr)
              subprocess.run(["ffmpeg","-y","-i",raw,"-codec:a","libmp3lame",
                              "-b:a","192k",f"{tag}.mp3"], capture_output=True)
              dur = full.shape[-1]/model.sr
              print(f"{tag}: {dur:.1f}s audio in {time.time()-t0:.0f}s "
                    f"({(time.time()-t0)/dur:.1f}x realtime)")
          PY

      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: british-narrator-samples
          path: '*.mp3'
          if-no-files-found: warn
          retention-days: 5
