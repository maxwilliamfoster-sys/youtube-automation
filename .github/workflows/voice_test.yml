name: Voice test — Chatterbox British narrator

# Renders the SAME script through several narrator settings so they can be compared
# by ear before the production default changes. 2026-10-09: the production voice
# (energetic reference, exaggeration 1.0) drew "sounds like a children's entertainer
# giving kids a quiz" from a viewer, so this round compares calmer registers against it.
# The script goes through the production number normaliser, as real videos do.

on:
  workflow_dispatch:

jobs:
  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: chatterbox-pip-v1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts num2words
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Generate narrator samples
        run: |
          python - <<'PY'
          import re, time, torch, torchaudio, subprocess

          from chatterbox.tts import ChatterboxTTS

          SCRIPT = ("On the fourteenth of September, two thousand and seven, fourteen-year-old "
                    "Andrew Gosden withdrew two hundred pounds and bought a single ticket to "
                    "London. Cameras at King's Cross caught him walking out of the station. "
                    "It is the last confirmed sighting. His bank card was never used again. "
                    "There was no phone signal. Nothing. Eighteen years later, his family are "
                    "still searching. What do you think happened to Andrew?")

          def sentences(text):
              parts = [s.strip() for s in re.split(r'(?<=[.!?])\s+', text) if s.strip()]
              out, buf = [], ""
              for p in parts:                       # same merging as production
                  buf = f"{buf} {p}".strip() if buf else p
                  if len(buf.split()) >= 4:
                      out.append(buf); buf = ""
              if buf:
                  out[-1] = f"{out[-1]} {buf}"
              return out

          model = ChatterboxTTS.from_pretrained(device="cpu")

          # (tag, reference clip, exaggeration, cfg_weight, gap between sentences)
          VARIANTS = [
              ("A_current_energetic", "assets/narrator_ref_energetic_ryan.wav", 1.0,  0.42, 0.42),
              ("B_calm_ryan",         "assets/narrator_ref_ryan.wav",           0.45, 0.5,  0.5),
              ("C_sombre_ryan",       "assets/narrator_ref_sombre_ryan.wav",    0.45, 0.5,  0.5),
              ("D_sombre_ryan_still", "assets/narrator_ref_sombre_ryan.wav",    0.3,  0.55, 0.55),
              ("E_sombre_thomas",     "assets/narrator_ref_sombre_thomas.wav",  0.45, 0.5,  0.5),
          ]
          for tag, ref, exag, cfg, gap in VARIANTS:
              torch.manual_seed(7)
              t0 = time.time(); chunks = []
              for s in sentences(SCRIPT):
                  chunks.append(model.generate(s, audio_prompt_path=ref,
                                               exaggeration=exag, cfg_weight=cfg))
                  chunks.append(torch.zeros(1, int(model.sr * gap)))
              full = torch.cat(chunks[:-1], dim=-1)
              torchaudio.save(f"{tag}.wav", full, model.sr)
              # Same loudness for every sample, so they are compared on delivery alone.
              subprocess.run(["ffmpeg", "-y", "-i", f"{tag}.wav", "-af",
                              "loudnorm=I=-16:TP=-2:LRA=11", "-codec:a", "libmp3lame",
                              "-b:a", "192k", f"{tag}.mp3"], capture_output=True)
              print(f"{tag}: {full.shape[-1]/model.sr:.1f}s in {time.time()-t0:.0f}s")
          PY

      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narrator-samples
          path: '*.mp3'
          if-no-files-found: warn
          retention-days: 7
