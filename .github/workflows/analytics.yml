name: BuriedCasefiles — Analytics snapshot

# Once a day: public TikTok stats + comments for every video -> analytics/snapshots.csv
# and analytics/comments.json, committed so the scheduled format reviews have a
# history (views at the same video age, not just today's totals). No login needed.

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

concurrency:
  group: documentary
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Collect
        run: python analytics/collect.py
        env:
          BUFFER_API_KEY:    ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/
          if git diff --staged --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "chore: analytics snapshot [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
