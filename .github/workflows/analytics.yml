name: BuriedCasefiles — Analytics snapshot

# Once a day: public TikTok stats + comments for every video -> analytics/snapshots.csv
# and analytics/comments.json, committed so the scheduled format reviews have a
# history (views at the same video age, not just today's totals). No login needed.

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

# Own group: GitHub keeps only ONE pending run per group, so sharing "documentary"
# let a queued generate run replace (cancel) a queued snapshot. The commit below
# rebases before pushing, and the two workflows touch different files.
concurrency:
  group: bcf-analytics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Collect
        run: python analytics/collect.py
        env:
          BUFFER_API_KEY:    ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      # Nightly experiment loop (growth-lab): judge / promote / revert / start one
      # test from levers.json. Writes only experiments.json, loop_config.json and
      # loop_summary.json; never fails the job. Pause: "paused": true in loop_config.json.
      - name: Experiment loop
        run: python loop_nightly.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/
          for f in experiments.json loop_config.json loop_summary.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet && exit 0
          git commit -m "chore: analytics snapshot [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash -q origin "${GITHUB_REF_NAME:-main}"; then
              git push origin "HEAD:${GITHUB_REF_NAME:-main}" && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i * 5))
          done
          echo "::error::could not push state after 3 tries"; exit 1
